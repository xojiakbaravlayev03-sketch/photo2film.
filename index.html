<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo2Film - AI Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1e293b;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background-color: #22c55e;
            color: #fff;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 0.95rem;
        }

        .bot-message {
            background-color: #1e293b;
            align-self: flex-start;
            border: 1px solid #334155;
        }

        .user-message {
            background-color: #2563eb;
            align-self: flex-end;
            color: white;
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 8px;
        }

        .input-area {
            background-color: #1e293b;
            padding: 12px;
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .image-preview-bar {
            display: none;
            position: relative;
            align-self: flex-start;
        }

        .image-preview-bar img {
            height: 50px;
            border-radius: 6px;
        }

        .remove-img {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            cursor: pointer;
            font-size: 10px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 12px;
            border-radius: 8px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .file-label {
            background-color: #334155;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .send-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎬 Photo2Film AI</div>
        <span class="badge">FREE</span>
    </header>

    <div class="chat-container" id="chatBox">
        <div class="message bot-message">
            Salom! Men <b>Photo2Film AI</b> yordamchisiman. 📸 Rasmingizni yuklang va uni videoga aylantirish uchun prompt yozing yoki istalgan savolingizni bering!
        </div>
    </div>

    <div class="input-area">
        <div class="image-preview-bar" id="previewBar">
            <img id="imgPreview" src="" alt="Preview">
            <button class="remove-img" onclick="clearImage()">✕</button>
        </div>
        
        <div class="controls">
            <label class="file-label">
                📸
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImage(this)">
            </label>
            <input type="text" id="userInput" placeholder="Prompt yozing yoki savol bering..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        let selectedImageBase64 = null;

        function handleImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageBase64 = e.target.result;
                    document.getElementById('imgPreview').src = e.target.result;
                    document.getElementById('previewBar').style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function clearImage() {
            selectedImageBase64 = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('previewBar').style.display = 'none';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text && !selectedImageBase64) return;

            // User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            
            let content = '';
            if (selectedImageBase64) {
                content += `<img src="${selectedImageBase64}" class="preview-img"><br>`;
            }
            if (text) content += text;
            
            userDiv.innerHTML = content;
            chatBox.appendChild(userDiv);

            // Reset input
            input.value = '';
            const currentImg = selectedImageBase64;
            clearImage();

            chatBox.scrollTop = chatBox.scrollHeight;

            // Bot Simulated Response
            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-message';
                
                if (currentImg) {
                    botDiv.innerHTML = `🎬 <b>Video Generatsiya So'rovi Qabul Qilindi!</b><br>
                    Promtingiz: "<i>${text || 'Harakatlantirish'}</i>"<br><br>
                    ⚡️ <i>Kadrlar ishlanmoqda... (Kelajakda bu yerga AI API ulanadi)</i>`;
                } else {
                    botDiv.innerHTML = `🤖 Savolingiz uchun rahmat! Hozircha men demo rejimida ishlayapman.`;
                }
                
                chatBox.appendChild(botDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
